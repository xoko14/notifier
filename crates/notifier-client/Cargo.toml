[package]
name = "notifier-client"
version = "0.3.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rmp-serde = "1.3.1"
notifier-common = { path = "../notifier-common" }
winrt-toast-reborn = "0.3.8"
shortcuts-rs = "1.1.1"
env_home = "0.1.0"
rand = "0.10.3"
rdev = { version = "0.5.3", features = ["unstable_grab"] }
